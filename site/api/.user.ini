; Yalnızca api/ betikleri için (kök .user.ini'yi cPanel yönetir, ona dokunulmaz).
; Mağaza fotoğrafı en fazla 8 MB: yükleme sınırı biraz üstünde kalsın ki fazlası PHP yerine mağaza koduyla reddedilsin.
upload_max_filesize = 10M
post_max_size = 12M
; Betik başlamadan çıkan PHP uyarıları (ör. büyük istek) cevabın başına yazılıp JSON'u bozmasın
display_errors = Off
