name: Yazı taslağı (siteye koymaz)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  taslak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Taslak yazıları üret
        env:
          YAZAR_TASLAK: '1'
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: node sync/taslak.mjs
