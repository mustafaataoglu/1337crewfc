name: Veriyi güncelle ve siteyi derle

on:
  schedule:
    # 15 dakikada bir EfendiLig + YouTube kontrolü. GitHub zamanlanmış çalışmaları yoğunlukta erteleyip atlıyor
    # (şu an 3-5 saatte bir geliyor); maç günleri güncelliği sync/pencere.mjs'deki maç penceresi döngüsü sağlar.
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      tam:
        description: 'Tam senkron (tüm ayrıntıları tazele)'
        type: boolean
        default: false
      dongu:
        description: 'Maç penceresi döngüsünün kendi başlattığı çalışma'
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ['web/**', 'server/**', 'sync/*.mjs', 'sync/*.sh', 'sync/ek-oyuncular.json', 'sync/gallery/**', '.github/workflows/**']

# Kod dağıtımları (push) veri döngüsünü beklemesin: ayrı kuyruk
concurrency:
  group: guncelle-${{ github.event_name == 'push' && 'kod' || 'veri' }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  guncelle:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: EfendiLig önbelleğini geri yükle
        uses: actions/cache@v4
        with:
          path: sync/cache
          key: efendilig-${{ github.run_id }}
          restore-keys: efendilig-

      # Actions önbelleği yoksa (silindi ya da 7 gün kullanılmadı) ham veri yedeği dalından (sync/yedekle.mjs), dal yoksa
      # ya da alınamazsa tohum veriden doldur. Tohum veri yedekte olmayan dosyaları da tamamlar (var olanın üzerine yazmaz).
      - name: Önbellek boşsa yedekten ya da tohum veriden doldur
        run: |
          set -o pipefail
          if [ ! -f sync/cache/state.json ]; then
            mkdir -p sync/cache
            if git fetch -q --depth=1 origin +refs/heads/efendilig-yedek:refs/remotes/origin/efendilig-yedek 2>/dev/null \
              && git archive refs/remotes/origin/efendilig-yedek cache | tar -x --skip-old-files -C sync; then
              echo "Önbellek yedek dalından yüklendi: $(ls sync/cache | wc -l) dosya"
            else
              echo "Yedek dalı yok ya da alınamadı, tohum önbellek kullanıldı"
            fi
            if [ -d sync/cache-seed ]; then cp -n sync/cache-seed/* sync/cache/ 2>/dev/null || true; fi
          fi

      - run: pnpm install --frozen-lockfile
        working-directory: web

      - name: Güncelle
        timeout-minutes: 40
        env:
          YAZAR_YAYINDA: '1'
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TAM: ${{ inputs.tam && '--tam' || '' }}
          ZORLA_PING: ${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.dongu)) && '1' || '0' }}
        run: bash sync/tur.sh

      # EfendiLig ham verisi ayrı 'efendilig-yedek' dalına (main zip'i büyümez). İşte bir kez, Güncelle başarılıysa; günde en
      # çok bir commit (tam senkronda beklemez). Maç penceresi turları yedeklemez. Hata işi düşürmez.
      - name: Ham veriyi yedekle
        timeout-minutes: 10
        continue-on-error: true
        env:
          TAM: ${{ inputs.tam && '--tam' || '' }}
        run: node sync/yedekle.mjs $TAM

      # Maç günü: maçtan 4 saat önce ile 6 saat sonrası arasında 10 dakikada bir tur (kod dağıtımlarında çalışmaz)
      - name: Maç penceresi
        if: ${{ !cancelled() && github.event_name != 'push' }}
        env:
          YAZAR_YAYINDA: '1'
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: node sync/pencere.mjs
