name: Veriyi güncelle ve siteyi derle

on:
  schedule:
    # 15 dakikada bir EfendiLig + YouTube kontrolü. GitHub zamanlanmış çalışmaları yoğunlukta erteleyip atlıyor
    # (şu an 3-5 saatte bir geliyor); maç günleri güncelliği sync/pencere.mjs'deki maç penceresi döngüsü sağlar.
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      tam:
        description: 'Tam senkron (tüm ayrıntıları tazele)'
        type: boolean
        default: false
      dongu:
        description: 'Maç penceresi döngüsünün kendi başlattığı çalışma'
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ['web/**', 'server/**', 'sync/*.mjs', 'sync/*.sh', 'sync/gallery/**', '.github/workflows/**']

# Kod dağıtımları (push) veri döngüsünü beklemesin: ayrı kuyruk
concurrency:
  group: guncelle-${{ github.event_name == 'push' && 'kod' || 'veri' }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  guncelle:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: EfendiLig önbelleğini geri yükle
        uses: actions/cache@v4
        with:
          path: sync/cache
          key: efendilig-${{ github.run_id }}
          restore-keys: efendilig-

      - name: Önbellek boşsa tohum veriyi kullan
        run: |
          if [ ! -f sync/cache/state.json ] && [ -d sync/cache-seed ]; then
            mkdir -p sync/cache && cp -n sync/cache-seed/* sync/cache/
            echo "Tohum önbellek kullanıldı"
          fi

      - run: pnpm install --frozen-lockfile
        working-directory: web

      - name: Güncelle
        timeout-minutes: 40
        env:
          YAZAR_YAYINDA: '1'
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TAM: ${{ inputs.tam && '--tam' || '' }}
          ZORLA_PING: ${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.dongu)) && '1' || '0' }}
        run: bash sync/tur.sh

      # Maç günü: maçtan 4 saat önce ile 6 saat sonrası arasında 10 dakikada bir tur (kod dağıtımlarında çalışmaz)
      - name: Maç penceresi
        if: ${{ !cancelled() && github.event_name != 'push' }}
        env:
          YAZAR_YAYINDA: '1'
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: node sync/pencere.mjs
