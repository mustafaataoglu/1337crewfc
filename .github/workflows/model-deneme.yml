name: Model deneme (geçici)

on:
  workflow_dispatch:

permissions:
  models: read
  contents: read

jobs:
  dene:
    runs-on: ubuntu-latest
    steps:
      - name: GitHub Models ile Türkçe deneme
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for m in openai/gpt-4.1 openai/gpt-4.1-mini meta/llama-3.3-70b-instruct; do
            echo "=== $m"
            curl -s https://models.github.ai/inference/chat/completions \
              -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/json" \
              -d "{\"model\":\"$m\",\"max_tokens\":220,\"messages\":[{\"role\":\"system\",\"content\":\"Amatör futbol takımı 1337 Crew FC'nin sitesi için kısa, doğal Türkçe maç haberleri yazıyorsun. Abartma, uydurma bilgi ekleme.\"},{\"role\":\"user\",\"content\":\"Maç: EfendiLig 2. hafta, Baston Villa 2-0 1337 Crew FC (deplasman). MVP rakipten Mehdi Çapar. Biz 1 puanla 11. sıradayız, sıradaki maç 7 Ekim'de evde lider Bordreaux JB ile. 2-3 cümlelik haber yaz.\"}]}" \
              | python3 -c "import sys,json; j=json.load(sys.stdin); print(j.get('choices',[{}])[0].get('message',{}).get('content') or j)"
          done
